name: Mirror Official Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: mirror-official-releases
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NuvioMedia/NuvioMobile
  TARGET_BRANCH: cmp-rewrite
  RELEASE_LIMIT: "20"

jobs:
  mirror:
    name: Mirror missing releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch official tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags --force

      - name: Mirror missing official releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          fork_repo="${GITHUB_REPOSITORY}"
          releases_json="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=${RELEASE_LIMIT}")"
          release_count="$(jq 'length' <<<"${releases_json}")"

          if [ "${release_count}" = "0" ]; then
            echo "No upstream releases found."
            exit 0
          fi

          for ((idx = release_count - 1; idx >= 0; idx--)); do
            release="$(jq ".[$idx]" <<<"${releases_json}")"
            tag="$(jq -r '.tag_name' <<<"${release}")"
            name="$(jq -r '.name // .tag_name' <<<"${release}")"
            draft="$(jq -r '.draft' <<<"${release}")"
            prerelease="$(jq -r '.prerelease' <<<"${release}")"
            upstream_url="$(jq -r '.html_url' <<<"${release}")"

            if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
              echo "Skipping upstream release with no tag."
              continue
            fi

            if [ "${draft}" = "true" ]; then
              echo "Skipping upstream draft release ${tag}."
              continue
            fi

            if gh release view "${tag}" --repo "${fork_repo}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists in ${fork_repo}."
              continue
            fi

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
                echo "Tag ${tag} already exists in ${fork_repo}."
              else
                git push origin "refs/tags/${tag}:refs/tags/${tag}"
              fi
            else
              echo "Upstream tag ${tag} was not fetched; release will target ${TARGET_BRANCH}."
            fi

            safe_tag="${tag//\//_}"
            body_file="${RUNNER_TEMP}/release-body-${safe_tag}.md"
            asset_dir="${RUNNER_TEMP}/release-assets-${safe_tag}"
            mkdir -p "${asset_dir}"

            jq -r '.body // ""' <<<"${release}" > "${body_file}"
            {
              echo
              echo "---"
              echo "Mirrored from upstream release: ${upstream_url}"
            } >> "${body_file}"

            if ! gh release download "${tag}" --repo "${UPSTREAM_REPO}" --dir "${asset_dir}" --clobber; then
              echo "No downloadable assets found for ${tag}, or asset download failed."
            fi

            create_args=(
              release create "${tag}"
              --repo "${fork_repo}"
              --title "${name}"
              --notes-file "${body_file}"
            )

            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              create_args+=(--target "${TARGET_BRANCH}")
            fi

            if [ "${prerelease}" = "true" ]; then
              create_args+=(--prerelease)
            fi

            assets=("${asset_dir}"/*)
            if [ "${#assets[@]}" -gt 0 ]; then
              create_args+=("${assets[@]}")
            fi

            gh "${create_args[@]}"
          done
