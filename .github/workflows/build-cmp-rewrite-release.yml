name: Build Current Fork Release

on:
  push:
    branches:
      - cmp-rewrite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-current-fork-release
  cancel-in-progress: true

env:
  UPSTREAM_REPO: NuvioMedia/NuvioMobile
  RELEASE_APK_NAME: kerry.nuvio.app.apk

jobs:
  build:
    name: Build signed fork APK from current cmp-rewrite and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cmp-rewrite branch
        uses: actions/checkout@v4
        with:
          ref: cmp-rewrite
          fetch-depth: 0
          token: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}

      - name: Read release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          app_version="$(sed -n 's/^MARKETING_VERSION=//p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          if [ -z "${app_version}" ]; then
            echo "::error::MARKETING_VERSION is missing from iosApp/Configuration/Version.xcconfig"
            exit 1
          fi
          if [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            base_version="${app_version}"
          elif [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            base_version="${app_version%.*}"
          else
            echo "::error::Release version must use x.x.x or x.x.x.N, got ${app_version}"
            exit 1
          fi

          git fetch --tags origin
          next_suffix="$(
            git tag -l "${base_version}.*" |
              awk -F. '
                {
                  suffix = $NF + 0
                  if (suffix > max) max = suffix
                }
                END { print max + 1 }
              '
          )"
          if [ -z "${next_suffix}" ] || ! [[ "${next_suffix}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine next fork release suffix for ${base_version}"
            exit 1
          fi

          tag="${base_version}.${next_suffix}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          upstream_tag="${base_version}"
          official_release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${upstream_tag}" 2>/dev/null || gh api "repos/${UPSTREAM_REPO}/releases/tags/v${upstream_tag}" 2>/dev/null || true)"
          official_url=""
          prerelease="false"

          if [ -n "${official_release_json}" ] && jq -e '.tag_name' <<<"${official_release_json}" >/dev/null 2>&1; then
            upstream_tag="$(jq -r '.tag_name' <<<"${official_release_json}")"
            official_url="$(jq -r '.html_url // ""' <<<"${official_release_json}")"
            prerelease="$(jq -r '.prerelease // false' <<<"${official_release_json}")"
            jq -r '.body // ""' <<<"${official_release_json}" > "${notes_file}"
            # Upstream body is identical for every fork tag with the same base version (e.g. 0.1.12.1 vs 0.1.12.2).
            # Always append fork-specific notes so each GitHub release is distinct.
            {
              echo
              echo "### This fork build (${tag})"
              echo
              fork_changelog="${RUNNER_TEMP}/fork-changelog-exact.md"
              if [ -f CHANGELOG.md ] && awk -v version="${tag}" '
                /^##[[:space:]]+/ {
                  heading = $0
                  sub(/^##[[:space:]]+/, "", heading)
                  sub(/^\[/, "", heading)
                  sub(/\].*$/, "", heading)
                  sub(/[[:space:]].*$/, "", heading)
                  if (heading == version) {
                    found = 1
                    next
                  }
                  if (found) exit
                }
                found { print }
                END { if (!found) exit 1 }
              ' CHANGELOG.md > "${fork_changelog}" && [ -s "${fork_changelog}" ]; then
                cat "${fork_changelog}"
              elif [ "${next_suffix}" -gt 1 ]; then
                previous_fork="${base_version}.$((next_suffix - 1))"
                if git rev-parse -q --verify "refs/tags/${previous_fork}" >/dev/null; then
                  # Do not fail the step if the revision range is invalid under set -e.
                  fork_commits="$(
                    git log --no-merges --pretty=format:'- %s (%h)' "${previous_fork}..${GITHUB_SHA}" 2>/dev/null || true
                  )"
                  if [ -n "${fork_commits}" ]; then
                    printf '%s\n' "${fork_commits}"
                  else
                    echo "No commit list since ${previous_fork} (empty range or unavailable history)."
                  fi
                  echo
                else
                  echo "Additional fork builds for upstream ${upstream_tag} reuse the official release notes above. This is tag ${tag}; compare to the previous fork tag ${previous_fork} in git for commit-level changes."
                  echo
                fi
              else
                echo "First fork build published for upstream release ${upstream_tag}."
                echo
              fi
            } >> "${notes_file}"
          else
            changelog_notes="${RUNNER_TEMP}/changelog-notes.md"
            if [ -f CHANGELOG.md ] && awk -v version="${tag}" -v base_version="${base_version}" '
              /^##[[:space:]]+/ {
                heading = $0
                sub(/^##[[:space:]]+/, "", heading)
                sub(/^\[/, "", heading)
                sub(/\].*$/, "", heading)
                sub(/[[:space:]].*$/, "", heading)
                if (heading == version || heading == base_version) {
                  found = 1
                  next
                }
                if (found) exit
              }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > "${changelog_notes}" && [ -s "${changelog_notes}" ]; then
              {
                echo "### Release Notes"
                cat "${changelog_notes}"
              } > "${notes_file}"
            else
              previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
              {
                echo "### Fork Changes"
                echo
                if [ -n "${previous_tag}" ]; then
                  fork_commits="$(
                    git log --no-merges --pretty=format:'- %s (%h)' "${previous_tag}..${GITHUB_SHA}" 2>/dev/null || true
                  )"
                  if [ -n "${fork_commits}" ]; then
                    printf '%s\n' "${fork_commits}"
                  else
                    echo "(Could not list commits since ${previous_tag}.)"
                  fi
                else
                  fork_commits="$(
                    git log --no-merges --pretty=format:'- %s (%h)' -n 20 "${GITHUB_SHA}" 2>/dev/null || true
                  )"
                  if [ -n "${fork_commits}" ]; then
                    printf '%s\n' "${fork_commits}"
                  else
                    echo "(Could not list recent commits.)"
                  fi
                fi
                echo
              } > "${notes_file}"
            fi
          fi

          {
            echo
            echo "---"
            echo "Fork build from ${GITHUB_REPOSITORY}:cmp-rewrite."
            if [ -n "${official_url}" ]; then
              echo "Official release source: ${official_url}"
              echo "This APK is built from this fork after syncing the official ${UPSTREAM_REPO} ${upstream_tag} release. Fork changes are included, while the app version and version code match the checked-in version file."
            fi
            echo "Build commit: ${GITHUB_SHA}"
          } >> "${notes_file}"

          echo "version=${tag}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "base_version=${base_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local build config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] || missing+=("ANDROID_RELEASE_KEYSTORE_BASE64")
          [ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ] || missing+=("ANDROID_RELEASE_STORE_PASSWORD")
          [ -n "${ANDROID_RELEASE_KEY_ALIAS}" ] || missing+=("ANDROID_RELEASE_KEY_ALIAS")
          [ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ] || missing+=("ANDROID_RELEASE_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required repository secrets/variables: %s\n' "${missing[*]}"
            exit 1
          fi

          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 -d > release-key.jks

          {
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}"
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL}"
            printf 'SUPABASE_ANON_KEY=%s\n' "${SUPABASE_ANON_KEY}"
            printf 'NUVIO_RELEASE_STORE_FILE=release-key.jks\n'
            printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "${ANDROID_RELEASE_STORE_PASSWORD}"
            printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "${ANDROID_RELEASE_KEY_ALIAS}"
            printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "${ANDROID_RELEASE_KEY_PASSWORD}"
          } > local.properties

      - name: Build full release APK
        shell: bash
        run: ./gradlew --console=plain :composeApp:assembleFullRelease -Pnuvio.release.abiSplit=true

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          apk="$(find composeApp/build/outputs/apk/full/release -maxdepth 1 -name '*arm64-v8a*release*.apk' ! -name '*unsigned.apk' | head -n 1)"
          if [ -z "${apk}" ]; then
            echo "::error::No signed arm64-v8a full release APK was produced."
            exit 1
          fi

          cp "${apk}" "dist/${RELEASE_APK_NAME}"
          ls -lh dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          notes_file="${{ steps.release.outputs.notes_file }}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Release tag ${tag} already exists. Rerun the workflow to calculate the next fork suffix."
            exit 1
          fi

          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
          release_file="${RUNNER_TEMP}/release.json"

          if [ -n "${release_json}" ] && jq -e '.id' <<<"${release_json}" >/dev/null 2>&1; then
            release_id="$(jq -r '.id' <<<"${release_json}")"
            jq -n \
              --arg name "${{ steps.release.outputs.version }}" \
              --arg target_commitish "${GITHUB_SHA}" \
              --rawfile body "${notes_file}" \
              --argjson prerelease "${{ steps.release.outputs.prerelease }}" \
              '{name: $name, target_commitish: $target_commitish, body: $body, prerelease: $prerelease}' > "${release_file}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input "${release_file}" >/dev/null
          else
            jq -n \
              --arg tag_name "${tag}" \
              --arg target_commitish "${GITHUB_SHA}" \
              --arg name "${{ steps.release.outputs.version }}" \
              --rawfile body "${notes_file}" \
              --argjson prerelease "${{ steps.release.outputs.prerelease }}" \
              '{tag_name: $tag_name, target_commitish: $target_commitish, name: $name, body: $body, draft: false, prerelease: $prerelease}' > "${release_file}"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input "${release_file}" >/dev/null
          fi

          gh release upload "${tag}" dist/*.apk --repo "${GITHUB_REPOSITORY}" --clobber
