name: Sync, Build, and Release Official Version

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official release tag to sync, build, and publish. Leave blank for latest."
        required: false
        type: string
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-build-release-official-version
  cancel-in-progress: true

env:
  UPSTREAM_REPO: NuvioMedia/NuvioMobile
  TARGET_BRANCH: cmp-rewrite

jobs:
  build:
    name: Sync official release, build fork APK, and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}

      - name: Prepare git remotes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

      - name: Read official release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.upstream_tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TAG}" ]; then
            release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/tags/${REQUESTED_TAG}")"
          else
            release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          fi

          upstream_tag="$(jq -r '.tag_name' <<<"${release_json}")"
          prerelease="$(jq -r '.prerelease' <<<"${release_json}")"
          upstream_url="$(jq -r '.html_url' <<<"${release_json}")"
          upstream_apk_url="$(jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url' <<<"${release_json}" | head -n 1)"

          if [ -z "${upstream_tag}" ] || [ "${upstream_tag}" = "null" ]; then
            echo "::error::Official release has no tag."
            exit 1
          fi
          if [ -z "${upstream_apk_url}" ] || [ "${upstream_apk_url}" = "null" ]; then
            echo "::error::Official release ${upstream_tag} has no APK asset."
            exit 1
          fi

          body_file="${RUNNER_TEMP}/release-body.md"
          official_notes_file="${RUNNER_TEMP}/official-release-notes.md"
          fork_notes_file="${RUNNER_TEMP}/fork-release-notes.md"
          fork_notes_source_file="${RUNNER_TEMP}/fork-release-notes-source.txt"
          upstream_version="${upstream_tag#v}"
          if ! [[ "${upstream_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Official release tag must resolve to x.x.x, got ${upstream_tag}."
            exit 1
          fi

          git fetch --tags origin
          existing_suffix="$(
            git tag -l "${upstream_version}.*" |
              awk -F. '
                {
                  suffix = $NF + 0
                  if (suffix > max) max = suffix
                }
                END { if (max > 0) print max }
              '
          )"
          if [ -n "${existing_suffix}" ]; then
            fork_tag="${upstream_version}.${existing_suffix}"
          else
            fork_tag="${upstream_version}.1"
          fi
          jq -r '.body // ""' <<<"${release_json}" > "${official_notes_file}"

          bash ./scripts/generate-fork-release-notes.sh \
            --tag "${fork_tag}" \
            --to "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-file "${fork_notes_source_file}" \
            > "${fork_notes_file}"
          fork_notes_source="$(cat "${fork_notes_source_file}")"

          {
            echo "## Fork changes"
            echo
            cat "${fork_notes_file}"
            echo "---"
            echo
            if [ -s "${official_notes_file}" ]; then
              echo "## Upstream release notes"
              echo
              cat "${official_notes_file}"
              echo
              echo "---"
              echo
            fi
            echo "## Build metadata"
            echo
            echo "- Fork release: ${fork_tag}"
            echo "- Upstream release: ${upstream_tag}"
            echo "- Fork notes source: ${fork_notes_source}"
            echo "- Repository: ${GITHUB_REPOSITORY}:${TARGET_BRANCH}"
            echo "- Official release: ${upstream_url}"
          } > "${body_file}"

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "upstream_apk_url=${upstream_apk_url}" >> "${GITHUB_OUTPUT}"
          echo "upstream_version=${upstream_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${fork_tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${fork_tag}" >> "${GITHUB_OUTPUT}"
          echo "apk_name=nuvio-freeteaspoon-full-${fork_tag}.apk" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "body_file=${body_file}" >> "${GITHUB_OUTPUT}"

      - name: Set up Android SDK for official APK metadata
        uses: android-actions/setup-android@v3

      - name: Sync official release source and version
        id: sync_source
        shell: bash
        run: |
          set -euo pipefail

          upstream_tag="${{ steps.release.outputs.upstream_tag }}"
          upstream_version="${{ steps.release.outputs.upstream_version }}"
          fork_tag="${{ steps.release.outputs.tag }}"
          official_tag_ref="refs/remotes/upstream/release-tags/${upstream_tag}"
          official_branch_ref="refs/remotes/upstream/${TARGET_BRANCH}"
          version_file="iosApp/Configuration/Version.xcconfig"
          git fetch upstream "refs/heads/${TARGET_BRANCH}:${official_branch_ref}" "refs/tags/${upstream_tag}:${official_tag_ref}"

          before="$(git rev-parse HEAD)"
          if ! git merge --no-edit "${official_branch_ref}"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "${conflicts}" != "${version_file}" ]; then
              echo "::error::Merge conflict while syncing ${UPSTREAM_REPO}:${TARGET_BRANCH}. Conflicted files:"
              printf '%s\n' "${conflicts}"
              exit 1
            fi

            git checkout --theirs -- "${version_file}"
            git add "${version_file}"
            git commit --no-edit
          fi

          official_version_file="${RUNNER_TEMP}/official-version.xcconfig"
          git show "${official_tag_ref}:${version_file}" > "${official_version_file}"
          official_marketing_version="$(sed -n 's/^MARKETING_VERSION=//p' "${official_version_file}" | head -n 1)"
          official_apk="${RUNNER_TEMP}/official-release.apk"
          curl -fsSL "${{ steps.release.outputs.upstream_apk_url }}" -o "${official_apk}"
          official_project_version="$(
            "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/aapt" dump badging "${official_apk}" |
              sed -n "s/^package:.*versionCode='\([0-9][0-9]*\)'.*$/\1/p" |
              head -n 1
          )"

          if [ "${official_marketing_version}" != "${upstream_version}" ]; then
            echo "::warning::Official ${upstream_tag} ${version_file} MARKETING_VERSION (${official_marketing_version}) does not match release tag ${upstream_tag}; using the tag's CURRENT_PROJECT_VERSION for this fork build."
          fi

          if ! [[ "${official_project_version}" =~ ^[0-9]+$ ]]; then
            echo "::error::Official ${version_file} is missing a numeric CURRENT_PROJECT_VERSION."
            exit 1
          fi

          {
            printf 'CURRENT_PROJECT_VERSION=%s\n' "${official_project_version}"
            printf 'MARKETING_VERSION=%s\n' "${fork_tag}"
          } > "${version_file}"

          if ! git diff --quiet -- "${version_file}"; then
            git add "${version_file}"
            git commit -m "Sync app version to ${fork_tag} (${official_project_version})"
          fi

          after="$(git rev-parse HEAD)"

          if [ "${before}" != "${after}" ]; then
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Fork branch already includes ${UPSTREAM_REPO} release ${upstream_tag}."
          fi

          echo "build_commit=${after}" >> "${GITHUB_OUTPUT}"

      - name: Check existing fork release
        id: existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
          if [ -z "${release_json}" ] || ! jq -e '.id' <<<"${release_json}" >/dev/null 2>&1; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_id="$(jq -r '.id' <<<"${release_json}")"
          existing_target="$(jq -r '.target_commitish // ""' <<<"${release_json}")"
          build_commit="${{ steps.sync_source.outputs.build_commit }}"
          desired_apk_name="${{ steps.release.outputs.apk_name }}"
          desired_apk_count="$(jq -r --arg desired "${desired_apk_name}" '[.assets[]? | select(.name == $desired)] | length' <<<"${release_json}")"
          apk_asset_ids="$(
            jq -r --arg desired "${desired_apk_name}" '
              .assets[]?
              | select(.name != $desired)
              | select(
                  (.name | endswith(".apk")) or
                  (.content_type == "application/vnd.android.package-archive") or
                  (.name == "com.nuvio.app.freeteaspoon")
                )
              | .id
            ' <<<"${release_json}"
          )"
          has_release_apk="false"

          if [ "${desired_apk_count}" -gt 0 ]; then
            has_release_apk="true"
          fi

          if [ -n "${apk_asset_ids}" ]; then
            while IFS= read -r asset_id; do
              [ -n "${asset_id}" ] || continue
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                -f "name=${desired_apk_name}" >/dev/null
            done <<<"${apk_asset_ids}"
            echo "Renamed existing APK release asset to ${desired_apk_name}."
            has_release_apk="true"
          fi

          release_patch="${RUNNER_TEMP}/release-patch.json"
          jq -n \
            --arg name "${{ steps.release.outputs.name }}" \
            --arg target_commitish "${build_commit}" \
            --rawfile body "${{ steps.release.outputs.body_file }}" \
            --argjson prerelease "${{ steps.release.outputs.prerelease }}" \
            '{name: $name, target_commitish: $target_commitish, body: $body, prerelease: $prerelease}' > "${release_patch}"
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input "${release_patch}" >/dev/null

          if [ "${has_release_apk}" = "true" ] && [ "${existing_target}" = "${build_commit}" ]; then
            echo "Release ${tag} already exists with ${desired_apk_name}; release title, notes, and target are current."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          elif [ "${has_release_apk}" = "true" ]; then
            echo "Release ${tag} exists with an APK, but it targets ${existing_target}; rebuilding for ${build_commit}."
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Release ${tag} exists without ${desired_apk_name}; rebuilding APK."
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up JDK
        if: steps.existing_release.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.existing_release.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: steps.existing_release.outputs.skip != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        if: steps.existing_release.outputs.skip != 'true'
        shell: bash
        run: sdkmanager "platforms;android-37.0"

      - name: Write local build config
        if: steps.existing_release.outputs.skip != 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.NUVIO_SUPABASE_URL || vars.NUVIO_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.NUVIO_SUPABASE_ANON_KEY || vars.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL || vars.NUVIO_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY || vars.NUVIO_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID || vars.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI || vars.TRAKT_REDIRECT_URI || 'nuvio://auth/trakt' }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ] || missing+=("ANDROID_RELEASE_KEYSTORE_BASE64")
          [ -n "${ANDROID_RELEASE_STORE_PASSWORD}" ] || missing+=("ANDROID_RELEASE_STORE_PASSWORD")
          [ -n "${ANDROID_RELEASE_KEY_ALIAS}" ] || missing+=("ANDROID_RELEASE_KEY_ALIAS")
          [ -n "${ANDROID_RELEASE_KEY_PASSWORD}" ] || missing+=("ANDROID_RELEASE_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required repository secrets/variables: %s\n' "${missing[*]}"
            exit 1
          fi

          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 -d > release-key.jks

          {
            printf 'sdk.dir=%s\n' "${ANDROID_HOME}"
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL}"
            printf 'SUPABASE_ANON_KEY=%s\n' "${SUPABASE_ANON_KEY}"
            printf 'NUVIO_SUPABASE_URL=%s\n' "${NUVIO_SUPABASE_URL}"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "${NUVIO_SUPABASE_ANON_KEY}"
            printf 'TRAKT_CLIENT_ID=%s\n' "${TRAKT_CLIENT_ID}"
            printf 'TRAKT_CLIENT_SECRET=%s\n' "${TRAKT_CLIENT_SECRET}"
            printf 'TRAKT_REDIRECT_URI=%s\n' "${TRAKT_REDIRECT_URI}"
            printf 'INTRODB_API_URL=https://api.introdb.app\n'
            printf 'NUVIO_RELEASE_STORE_FILE=release-key.jks\n'
            printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "${ANDROID_RELEASE_STORE_PASSWORD}"
            printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "${ANDROID_RELEASE_KEY_ALIAS}"
            printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "${ANDROID_RELEASE_KEY_PASSWORD}"
          } > local.properties

      - name: Build full release APK
        if: steps.existing_release.outputs.skip != 'true'
        shell: bash
        run: ./gradlew --console=plain :androidApp:assembleFullRelease

      - name: Stage release asset
        if: steps.existing_release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          apk="$(find androidApp/build/outputs/apk/full/release -maxdepth 1 -name '*release*.apk' ! -name '*unsigned.apk' | head -n 1)"
          if [ -z "${apk}" ]; then
            echo "::error::No signed full release APK was produced."
            exit 1
          fi

          cp "${apk}" "dist/${{ steps.release.outputs.apk_name }}"
          ls -lh dist

      - name: Publish fork release
        if: steps.existing_release.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SYNC_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          build_commit="${{ steps.sync_source.outputs.build_commit }}"

          git tag -f "${tag}" "${build_commit}"
          git push --force origin "refs/tags/${tag}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
          release_file="${RUNNER_TEMP}/release.json"

          if [ -n "${release_json}" ] && jq -e '.id' <<<"${release_json}" >/dev/null 2>&1; then
            release_id="$(jq -r '.id' <<<"${release_json}")"
            jq -n \
              --arg name "${{ steps.release.outputs.name }}" \
              --arg target_commitish "${build_commit}" \
              --rawfile body "${{ steps.release.outputs.body_file }}" \
              --argjson prerelease "${{ steps.release.outputs.prerelease }}" \
              '{name: $name, target_commitish: $target_commitish, body: $body, prerelease: $prerelease}' > "${release_file}"
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --input "${release_file}" >/dev/null
          else
            jq -n \
              --arg tag_name "${tag}" \
              --arg target_commitish "${build_commit}" \
              --arg name "${{ steps.release.outputs.name }}" \
              --rawfile body "${{ steps.release.outputs.body_file }}" \
              --argjson prerelease "${{ steps.release.outputs.prerelease }}" \
              '{tag_name: $tag_name, target_commitish: $target_commitish, name: $name, body: $body, draft: false, prerelease: $prerelease}' > "${release_file}"
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input "${release_file}" >/dev/null
          fi

          gh release upload "${tag}" "dist/${{ steps.release.outputs.apk_name }}" --repo "${GITHUB_REPOSITORY}" --clobber
